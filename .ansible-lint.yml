---
# Mirrors Super-Linter's bundled defaults, which this file replaces wholesale,
# plus the collection handling below.
quiet: true

skip_list:
  - 'empty-string-compare' # Allow compare to empty string
  - '204' # Allow string length greater than 160 chars
  - 'no-changed-when' # False positives for running command shells
  - 'command-instead-of-module' # Allow git commands for push, add, etc...
  - 'command-instead-of-shell' # Allow use of shell when you want
  - 'no-handler' # Allow step to run like handler
  - 'unnamed-task' # Allow tasks without a name
  # - 'yaml' # Ansible yml is excluded in .prettierignore

use_default_rules: true
verbosity: 1

# The Super-Linter image ships no Ansible collections, so syntax-check cannot
# resolve community.docker and fails fatally. Galaxy installs are not possible
# from inside the linter container, so declare the modules instead; they stay
# resolvable offline and are installed for real by docker/ansible/setup-ansible.sh.
# Mocked modules carry no argument spec, so they emit non-fatal args[module]
# warnings. That rule is deliberately left enabled to keep validating every
# other module.
offline: true

mock_modules:
  - community.docker.docker_container
  - community.docker.docker_container_exec
  - community.docker.docker_image
  - community.docker.docker_image_pull
