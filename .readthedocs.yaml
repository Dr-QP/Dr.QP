# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    nodejs: '20'
    python: '3.12'
  apt_packages:
    - ffmpeg

  # Use structured build jobs: unlike build.commands, they retain the
  # system-dependency step above so the docs build can invoke ffmpeg.
  jobs:
    install:
      - pip install uv
      - uv sync --frozen --group docs
    pre_build:
      - ffmpeg -version
    build:
      html:
        - uv run sphinx-build -b html docs/source $READTHEDOCS_OUTPUT/html
