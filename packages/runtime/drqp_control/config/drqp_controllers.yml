controller_manager:
  ros__parameters:
    update_rate: 1000 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      update_rate: 100 # Hz

    battery_state_broadcaster:
      type: battery_state_broadcaster/BatteryStateBroadcaster
      update_rate: 10 # Hz

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      update_rate: 100 # Hz

joint_trajectory_controller:
  ros__parameters:
    joints:
      - drqp/left_front_coxa
      - drqp/left_front_femur
      - drqp/left_front_tibia

      - drqp/right_front_coxa
      - drqp/right_front_femur
      - drqp/right_front_tibia

      - drqp/left_middle_coxa
      - drqp/left_middle_femur
      - drqp/left_middle_tibia

      - drqp/right_middle_coxa
      - drqp/right_middle_femur
      - drqp/right_middle_tibia

      - drqp/left_back_coxa
      - drqp/left_back_femur
      - drqp/left_back_tibia

      - drqp/right_back_coxa
      - drqp/right_back_femur
      - drqp/right_back_tibia

    command_interfaces:
      - position
      - effort

    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 20.0 # Defaults to 20

    allow_partial_joints_goal: true # Defaults to false
    interpolate_from_desired_state: true
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01 # Defaults to 0.01
      goal_time: 0.0 # Defaults to 0.0 (start immediately)

# https://control.ros.org/jazzy/doc/ros2_controllers/battery_state_broadcaster/doc/userdoc.html
#
# battery_state_broadcaster moved into ros2_controllers (1.2.0 -> 4.x), which
# made `batteries` required and deprecated the old `sensor_name` mode. Each
# listed battery reads `<name>/battery_voltage` (mandatory) from the hardware
# interface; every other interface is opt-in under `interfaces.<name>`. The
# drqp hardware exports voltage only, so those stay off and the broadcaster
# derives `percentage` from the min/max voltage range below.
battery_state_broadcaster:
  ros__parameters:
    batteries:
      - battery_state
    battery_state:
      # 3S LiPo: 3.5V per cell (empty) to 4.2V per cell (full).
      minimum_voltage: 10.5
      maximum_voltage: 12.6
      # https://github.com/ros2/common_interfaces/blob/jazzy/sensor_msgs/msg/BatteryState.msg
      power_supply_technology: 3 # POWER_SUPPLY_TECHNOLOGY_LIPO
