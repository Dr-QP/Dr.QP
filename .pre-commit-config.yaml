exclude: '(^packages/vendor/|.*/test_data/.*|^packages/runtime/drqp_rapidjson/include/.*|^hardware/overalays/.*)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Aligned with what super-linter handles with prettier in this repo
        # .prettierignore still applies
        files: '\.(md|markdown|ya?ml|json|jsonc)$'
        additional_dependencies: [prettier@3.8.1]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.2
    hooks:
      - id: clang-format
        files: '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$'

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.1.1
    hooks:
      - id: ansible-lint
        files: '^docker/ros/ansible/.*\.ya?ml$'
        args: ['--project-dir=docker/ros/ansible']
        language_version: python3
        pass_filenames: true
        always_run: false

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
        entry: ghcr.io/hadolint/hadolint:v2.14.0 hadolint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-format
      # `I` (isort) is in ruff.toml's select list, so this single pass also
      # sorts imports. Mirrors what Super-Linter runs in CI.
      - id: ruff
        args: [--fix]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.103.7
    hooks:
      - id: renovate-config-validator
        # --no-global validates the file as a repository config. The hook's
        # default invocation applies the self-hosted global schema instead,
        # which accepts and rejects a different set of options, so without it
        # this would not be checking what Renovate actually reads. --strict
        # also fails on warnings and on a config that needs migration. Both
        # flags match .github/workflows/validate-renovate-config.yml.
        #
        # This hook pins Renovate through additional_dependencies, deliberately
        # unlike that workflow: this is the fast deterministic local gate,
        # while the workflow is left unpinned so it tracks whatever the
        # Mend-hosted app currently runs. Do not "fix" the inconsistency.
        args: [--no-global, --strict]
        # The hook ships language_version: lts, which the devcontainer's
        # nodeenv (0.13.4) rejects outright -- it parses the value as a version
        # number and raises InvalidVersion. The image provides Node 24, so use
        # it directly rather than having pre-commit build a toolchain.
        language_version: system

  - repo: local
    hooks:
      - id: zizmor
        name: zizmor
        entry: zizmor
        language: system
        files: '^\.github/(actions|workflows)/.*\.ya?ml$'

      - id: notebooks-format
        name: notebooks-format
        entry: ./scripts/notebooks-format.sh
        language: script
        pass_filenames: true
        files: '(docs/source/notebooks/.*\.md)$'

      # The validator comes from the digest-pinned dev image, which installs it
      # as a uv tool on PATH. This repository consumes the agent-devcontainer
      # template and so carries no working-tree copy to run through `uv run`.
      - id: validate-agent-files
        name: validate-agent-files
        entry: validate_agent_files
        language: system
        files: '\.claude/skills/.*/SKILL\.md$'
        pass_filenames: true

      # `uv run` because the gate must read the working-tree plans being
      # committed. It audits the whole plans directory rather than the staged
      # subset, so it takes no filenames.
      - id: plan-checkboxes
        name: plan-checkboxes
        entry: uv run pytest docs/knowledge/tests
        language: system
        files: '^docs/knowledge/data/plans/.*\.md$'
        pass_filenames: false

      # Mirrors the Knowledge base validation workflow. Hooks read the whole graph
      # from the repo root, so they take no filenames and trigger on any
      # graph-affecting change under docs/knowledge/ or .iwe/.
      #
      # Both need `iwe` on PATH. The dev image does not ship it yet, so these
      # hooks fail locally until it is rebased on agent-desktop; CI installs iwe
      # itself. See docs/agents/specs/agent-devcontainer-migration/.
      - id: iwe-schema-validate
        name: iwe-schema-validate
        entry: iwe schema validate
        language: system
        files: '^(docs/knowledge/.*\.md|\.iwe/.*)$'
        pass_filenames: false

      # normalize rewrites files in place and returns 0 even after changing files;
      # git diff --exit-code turns drift into failure while leaving normalized files
      # staged-out for review and re-add, matching CI's no-op check.
      - id: iwe-normalize
        name: iwe-normalize
        entry: bash -c 'iwe normalize && git diff --exit-code'
        language: system
        files: '^(docs/knowledge/.*\.md|\.iwe/.*)$'
        pass_filenames: false
