exclude: '(^packages/vendor/|.*/test_data/.*|^packages/runtime/drqp_rapidjson/include/.*|^hardware/overalays/.*)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: ./scripts/super-linter/prettier --write --list-different --ignore-unknown
        language: system
        files: '\.(md|markdown|ya?ml|json|jsonc)$'

      - id: clang-format
        name: clang-format
        entry: ./scripts/super-linter/clang-format -i -style=file
        language: system
        files: '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$'

      - id: ansible-lint
        name: ansible-lint
        entry: ./scripts/super-linter/ansible-lint -v --force-color
        language: system
        files: '^docker/ros/ansible/.*\.ya?ml$'

      - id: hadolint-docker
        name: hadolint
        entry: ./scripts/super-linter/hadolint
        language: system
        files: '(^|/)(Dockerfile(\..*)?|[^/]+\.dockerfile)$'

      - id: ruff-format
        name: ruff format
        entry: ./scripts/super-linter/ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff
        name: ruff lint
        entry: ./scripts/super-linter/ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-isort
        name: ruff isort
        entry: ./scripts/super-linter/ruff check --force-exclude --fix --select I
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: shellcheck
        name: shellcheck
        entry: ./scripts/super-linter/shellcheck
        language: system
        types: [shell]
        require_serial: true

      - id: gitleaks
        name: gitleaks
        entry: ./scripts/super-linter/gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: ./scripts/super-linter/actionlint
        language: system
        files: '^\.github/workflows/'

      - id: zizmor
        name: zizmor
        entry: ./scripts/super-linter/zizmor
        language: system
        files: '^\.github/(actions|workflows)/.*\.ya?ml$'

      - id: notebooks-format
        name: notebooks-format
        entry: ./scripts/notebooks-format.sh
        language: script
        pass_filenames: true
        files: '(docs/source/notebooks/.*\.md)$'

      - id: validate-agent-files
        name: validate-agent-files
        entry: uv run validate_agent_files
        language: system
        files: '(\.claude/skills/.*/SKILL\.md|\.claude/agents/.*\.agent\.md|\.codex/agents/.*\.md)$'
        pass_filenames: true
