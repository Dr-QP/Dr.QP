exclude: '(^packages/vendor/|.*/test_data/.*|^packages/runtime/drqp_rapidjson/include/.*|^hardware/overalays/.*)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Aligned with what super-linter handles with prettier in this repo
        # .prettierignore still applies
        files: '\.(md|markdown|ya?ml|json|jsonc)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff-format
      - id: ruff # lint
        args: [--fix]
      - id: ruff # isort
        args: [--fix, --select, I]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: notebooks-format
        name: notebooks-format
        entry: ./scripts/notebooks-format.sh
        language: script
        pass_filenames: true
        files: '(docs/source/notebooks/.*\.md)$'

      - id: validate-agent-files
        name: validate-agent-files
        entry: uv run validate_agent_files
        language: system
        files: '(\.claude/skills/.*/SKILL\.md|\.claude/agents/.*\.agent\.md|\.codex/agents/.*\.md)$'
        pass_filenames: true
