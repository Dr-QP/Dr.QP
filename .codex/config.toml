# Disabling Codex's own sandbox/approval gate here is safe only because interactive Codex
# sessions for this repo run inside the devcontainer (.devcontainer/devcontainer.json), which
# already sandboxes the host.
#
# CAVEAT: Codex Cloud tasks are bootstrapped by .codex/setup-codex-cloud.sh on a bare host, not
# the devcontainer (that script explicitly has no ROS environment) — they are not covered by the
# assumption above, and Codex has no config key here to scope sandbox_mode/approval_policy to one
# environment. If this repo starts running Codex Cloud tasks, revisit these settings first.
sandbox_mode = "danger-full-access"
approval_policy = "never"
