name: Shared paths filters
description: A set of filters to be used to fitler jobs
inputs:
  event-name:
    description: GitHub event name
    required: false
    default: ''
  base-branch:
    description: Base branch
    required: false
    default: main
  extra-filter:
    description: Extra filters (YAML list entries, one per line)
    required: false
    default: 'default-path-that-will-never-match'
outputs:
  pass:
    description: Filtered file present
    value: ${{ steps.filter-pr.outputs.ros || steps.filter-base.outputs.ros }}
runs:
  using: composite
  steps:
    - name: Build filters
      id: build-filters
      shell: bash -xeuo pipefail {0}
      run: |
        # Build the filters YAML with proper formatting for extra-filter
        EXTRA=$(printf '%s\n' "${INPUTS_EXTRA_FILTER}" | \
          sed -En 's/^[[:space:]]*-[[:space:]]*//p' | \
          sed -E 's/^/  - /' | \
          sed '/^  - $/d')
        {
          echo "filters<<EOF"
          cat <<'YAML'
        ros:
          - .clang-format
          - .devcontainer/**
          - .github/actions/**
          - codecov.yml
          - docker/**
          - packages/**
          - scripts/**
        YAML
          if [ -n "$EXTRA" ]; then
            printf '%s\n' "$EXTRA"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
      env:
        INPUTS_EXTRA_FILTER: ${{ inputs.extra-filter }}

    - name: Filter (pull request)
      if: inputs.event-name == 'pull_request'
      id: filter-pr
      uses: dorny/paths-filter@v4.0.3
      with:
        filters: ${{ steps.build-filters.outputs.filters }}

    # A newer push cancels the running check, so the previous push may never
    # have passed; diff from the last commit this workflow passed on instead.
    - name: Find the last commit this workflow passed on
      if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.base-branch)
      id: last-pass
      shell: bash -euo pipefail {0}
      run: |
        if ! workflow_id="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq .workflow_id)" ||
          ! sha="$(gh api "repos/${REPO}/actions/workflows/${workflow_id}/runs?branch=${BRANCH}&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"; then
          echo "::warning::Could not look up the last passing run; comparing against the previous push."
          exit 0
        fi
        if [[ -n "$sha" && "$sha" != "$HEAD_SHA" ]]; then
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        fi
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        BRANCH: ${{ inputs.base-branch }}
        HEAD_SHA: ${{ github.sha }}

    - name: Filter (non pull request)
      if: inputs.event-name != 'pull_request'
      id: filter-base
      uses: dorny/paths-filter@v4.0.3
      with:
        base: ${{ steps.last-pass.outputs.sha || inputs.base-branch }}
        filters: ${{ steps.build-filters.outputs.filters }}
