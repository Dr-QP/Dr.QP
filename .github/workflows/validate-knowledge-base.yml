name: Knowledge base validation

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # The dev image does not ship iwe yet, so this job installs it from crates.io.
  # Once the image is rebased on agent-desktop (which carries iwe), pin this to
  # the version that image installs. See
  # docs/agents/specs/agent-devcontainer-migration/.
  IWE_VERSION: 0.19.0

jobs:
  paths-filter:
    name: Need to run?
    runs-on: ${{ vars.AMD_ONLY == '1' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      pass: ${{ steps.filter.outputs.pass }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Filters
        uses: ./.github/actions/paths-filter
        id: filter
        with:
          event-name: ${{ github.event_name }}
          extra-filter: |
            - docs/knowledge/**
            - .iwe/**
            - .github/workflows/validate-knowledge-base.yml
            - .github/actions/log-debug-stats/**

      - name: Log debug stats
        if: ${{ always() }}
        uses: ./.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  validate-knowledge-base:
    name: Validate knowledge base
    runs-on: ubuntu-latest
    needs: paths-filter
    permissions:
      contents: read
    timeout-minutes: 30
    if: needs.paths-filter.outputs.pass == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache the iwe binary
        id: cache-iwe
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/iwe
          key: iwe-${{ runner.os }}-${{ env.IWE_VERSION }}

      - name: Install iwe
        if: steps.cache-iwe.outputs.cache-hit != 'true'
        run: cargo install iwe --locked --version "$IWE_VERSION"

      - name: Validate every document against its schemas
        run: iwe schema validate

      - name: Check that normalization is a no-op
        run: |
          iwe normalize
          git diff --exit-code

      - name: Set up the Python environment
        uses: ./.github/actions/setup-python-venv

      - name: Check that ticked plan checkboxes carry evidence
        run: uv run pytest docs/knowledge/tests

      - name: Log debug stats
        if: ${{ always() }}
        uses: ./.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  finished:
    name: Knowledge base validation finished
    needs: [paths-filter, validate-knowledge-base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Execution was not needed!
        if: needs.paths-filter.outputs.pass != 'true'
        run: |
          exit 0
      - name: All jobs succeeded!
        if: ${{ success() }}
        run: |
          exit 0
      - name: Some jobs have failed!
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          exit 1
      - name: Some jobs have been cancelled!
        if: ${{ cancelled() || contains(needs.*.result, 'cancelled') }}
        run: |
          exit 1

      - name: Log debug stats
        if: ${{ always() }}
        uses: ./.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}
