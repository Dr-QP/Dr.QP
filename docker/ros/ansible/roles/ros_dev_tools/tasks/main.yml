---
# ROS-specific development tools.
#
# This is the delta over the base image's `dev_tools` role, which already
# installs the generic set (bash-completion, build-essential, cmake, dirmngr,
# git, git-lfs, gnupg2, ninja-build, pre-commit, python3-argcomplete,
# python3-pip, python3-setuptools, python3-venv, shellcheck, ffmpeg, btop) and
# the pinned single-binary tools including zizmor and iwe. Adding any of those
# here would be redundant, not harmful — but it would hide drift, so keep this
# list strictly to packages the base image does not provide.
#
# The git-core PPA is likewise already added by the base image's dev_tools.
#
# Requires ros_repo and osrf_repo to have run: ros-dev-tools and the colcon
# packages come from the ROS 2 apt repository, and python3-gz-transport13 from
# the OSRF one.
- name: Install ROS development tools
  ansible.builtin.apt:
    name:
      - lcov
      - libasio-dev
      - libbullet-dev
      - libcunit1-dev
      - libtinyxml2-dev
      - python3-colcon-cmake
      - python3-colcon-common-extensions
      - python3-colcon-coveragepy-result
      - python3-colcon-lcov-result
      - python3-colcon-mixin
      - python3-colcon-output
      - python3-colcon-package-information
      - python3-coverage
      - python3-flake8
      - python3-flake8-blind-except
      - python3-flake8-builtins
      - python3-flake8-class-newline
      - python3-flake8-comprehensions
      - python3-flake8-deprecated
      - python3-flake8-docstrings
      - python3-flake8-import-order
      - python3-flake8-quotes
      - python3-gz-transport13
      - python3-mypy
      - python3-pytest
      - python3-pytest-cov
      - python3-pytest-mock
      - python3-pytest-repeat
      - python3-pytest-rerunfailures
      - python3-pytest-runner
      - python3-pytest-timeout
      - python3-rosdep
      - python3-scipy
      - python3-toml
      - python3-vcstool
      - ros-dev-tools
    state: present
    install_recommends: false
    update_cache: true
