---
# Development tools installation
- name: Add Git Core PPA
  ansible.builtin.apt_repository:
    repo: ppa:git-core/ppa
    state: present
    filename: git-core-ppa

- name: Install development tools
  ansible.builtin.apt:
    name:
      - bash-completion
      - build-essential
      - cmake
      - dirmngr
      - git
      - git-lfs
      - gnupg2
      - lcov
      - libasio-dev
      - libbullet-dev
      - libcunit1-dev
      - libtinyxml2-dev
      - ninja-build
      - python3-argcomplete
      - python3-colcon-cmake
      - python3-colcon-common-extensions
      - python3-colcon-coveragepy-result
      - python3-colcon-lcov-result
      - python3-colcon-mixin
      - python3-colcon-output
      - python3-colcon-package-information
      - python3-coverage
      - python3-flake8
      - python3-flake8-blind-except
      - python3-flake8-builtins
      - python3-flake8-class-newline
      - python3-flake8-comprehensions
      - python3-flake8-deprecated
      - python3-flake8-docstrings
      - python3-flake8-import-order
      - python3-flake8-quotes
      - python3-gz-transport13
      - python3-mypy
      - python3-pip
      - pre-commit
      - python3-pytest
      - python3-pytest-cov
      - python3-pytest-mock
      - python3-pytest-repeat
      - python3-pytest-rerunfailures
      - python3-pytest-runner
      - python3-pytest-timeout
      - python3-rosdep
      - python3-scipy
      - python3-setuptools
      - python3-toml
      - python3-vcstool
      - python3-venv
      - ros-dev-tools
      - shellcheck
      - ffmpeg # for rendering notebooks animations
      - btop # for monitoring resource usage in development
    state: present
    install_recommends: false
    update_cache: true

- name: Ensure zizmor supports the current architecture
  ansible.builtin.assert:
    that: system_arch in dev_tools_zizmor_archives
    fail_msg: "zizmor is not available for architecture {{ system_arch }}"

- name: Create temporary directory for zizmor
  ansible.builtin.tempfile:
    state: directory
  register: dev_tools_zizmor_temp_dir

- name: Download zizmor
  ansible.builtin.get_url:
    url: >-
      {{ 'https://github.com/zizmorcore/zizmor/releases/download/'
      ~ dev_tools_zizmor_version ~ '/zizmor-'
      ~ dev_tools_zizmor_archives[system_arch].target ~ '.tar.gz' }}
    dest: "{{ dev_tools_zizmor_temp_dir.path }}/zizmor.tar.gz"
    checksum: "sha256:{{ dev_tools_zizmor_archives[system_arch].checksum }}"
    mode: "0644"

- name: Install zizmor
  ansible.builtin.unarchive:
    src: "{{ dev_tools_zizmor_temp_dir.path }}/zizmor.tar.gz"
    dest: "{{ dev_tools_zizmor_install_path | dirname }}"
    remote_src: true

- name: Clean up temporary zizmor files
  ansible.builtin.file:
    path: "{{ dev_tools_zizmor_temp_dir.path }}"
    state: absent
