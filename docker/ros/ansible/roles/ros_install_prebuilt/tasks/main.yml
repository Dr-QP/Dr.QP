---
# ROS 2 prebuilt installation
#
# This role used to run a blanket `apt upgrade` first. It is gone: every
# package the playbook installs is pinned, so an upgrade could only move
# something off its pin. Upgrading inherited packages is the base image prep
# phase's job, and that phase lives in agentdev, not here.

- name: Load pinned apt versions
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/apt_pins_{{ system_dist }}_{{ system_arch }}.yml"

- name: Install ROS 2 from packages
  ansible.builtin.apt:
    name: "{{ ros_install_prebuilt_desktop_package }}={{ ros_install_prebuilt_apt_pins[ros_install_prebuilt_desktop_package] }}"
    state: present
    update_cache: true
    install_recommends: false
  vars:
    ros_install_prebuilt_desktop_package: "ros-{{ ros_distro }}-desktop"
