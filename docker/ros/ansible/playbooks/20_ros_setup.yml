---
# Main playbook for ROS 2 setup.
#
# This runs on top of ghcr.io/plume-works/agent-desktop, which already provides
# the generic development environment: locale and timezone, bash/fish, the
# Kitware CMake, the generic dev_tools package set, the pinned single-binary
# tools (zizmor, iwe, codebase-memory-mcp), gh, bun, node, uv, the agentic
# tools, Docker, Xpra, and the devcontainer firewall. Only the ROS delta is
# built here.
#
# extra_facts is retained locally rather than inherited: the base image's copy
# ran at *its* build time, so the facts it set are not present in this
# playbook's run. It also asserts ros_distro is defined, which is the fail-fast
# guard for this playbook.
- name: Setup ROS 2 Environment
  hosts: all
  become: true
  gather_facts: true

  # Upgrading the base image's packages has to happen before the first pinned
  # install, not in the middle of the run: ros_install_prebuilt used to do it
  # and would have upgraded whatever ros_dev_tools had already installed at its
  # pinned version, silently defeating the pins.
  pre_tasks:
    - name: Upgrade packages inherited from the base image
      ansible.builtin.apt:
        upgrade: true
        update_cache: true
      tags: ["upgrade"]

  roles:
    - { role: extra_facts, tags: ["extra_facts", "always"] }
    - { role: cmake_system, tags: ["cmake"], when: source_install }
    - { role: ros_repo, tags: ["ros_repo"] }
    - { role: osrf_repo, tags: ["osrf_repo"] }
    - { role: ros_dev_tools, tags: ["ros_dev_tools", "dev_tools"] }
    - { role: ros_shell_setup, tags: ["ros_shell_setup"] }
    - { role: colcon_setup, tags: ["colcon_setup"] }
    - { role: rosdep, tags: ["rosdep"] }
    - { role: ros_install_prebuilt, tags: ["ros_install", "ros_install_prebuilt"], when: not source_install }
    - { role: ros_install_source, tags: ["ros_install", "ros_install_source"], when: source_install }
    - { role: ros_patches, tags: ["ros_patches"] }
    - { role: ros_dependencies, tags: ["ros_dependencies"] }
    - { role: clang, tags: ["clang"] }
    - { role: virtualhere_usb_client, tags: ["virtualhere_usb_client"], when: install_virtualhere_usb_client | default(false) | bool }
